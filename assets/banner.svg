<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulseSlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 2000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes glowBeat {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6)); }
        50% { filter: drop-shadow(0 0 20px rgba(192, 132, 252, 0.9)); }
      }
      .bg-grid { opacity: 0.07; stroke: #94a3b8; stroke-width: 1; }
      .chart-line {
        stroke-dasharray: 2000;
        animation: dashMove 8s ease-in-out infinite alternate;
      }
      .floating-card {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .pulse-circle {
        transform-origin: center;
        animation: pulseSlow 4s ease-in-out infinite;
      }
      .glow-title {
        animation: glowBeat 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/>

  <!-- Subtle Grid Pattern -->
  <g class="bg-grid">
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
    <line x1="1100" y1="0" x2="1100" y2="360"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="pulse-circle"/>
  <circle cx="1050" cy="260" r="160" fill="#c084fc" opacity="0.12" filter="url(#glow)" class="pulse-circle"/>
  <circle cx="650" cy="180" r="180" fill="#6366f1" opacity="0.08" filter="url(#glow)"/>

  <!-- Analytics Chart Visual Background -->
  <path d="M 600,280 Q 720,240 820,190 T 1000,120 T 1160,70 L 1160,320 L 600,320 Z" fill="url(#areaGrad)"/>
  <path d="M 600,280 Q 720,240 820,190 T 1000,120 T 1160,70" fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" class="chart-line" filter="url(#subtleGlow)"/>

  <!-- Chart Nodes with dynamic rings -->
  <circle cx="820" cy="190" r="5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="1000" cy="120" r="6" fill="#818cf8" filter="url(#glow)"/>
  <circle cx="1160" cy="70" r="7" fill="#f43f5e" filter="url(#glow)"/>

  <!-- Header Category Badge -->
  <g transform="translate(60, 48)">
    <rect width="320" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">HOTEL REVENUE MANAGEMENT (RMS)</text>
  </g>

  <!-- Main Title -->
  <g class="glow-title" transform="translate(60, 130)">
    <text x="0" y="0" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Hospitality
    </text>
    <text x="0" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Revenue Management
    </text>
  </g>

  <!-- Subtitle / Keywords -->
  <text x="60" y="228" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
    Dynamic Pricing • Demand Forecasting • Rate Intelligence • RevPAR &amp; ADR Optimization
  </text>

  <!-- Feature Chips / Tags -->
  <g transform="translate(60, 265)">
    <g transform="translate(0, 0)">
      <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
      <text x="14" y="21" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Dynamic Pricing</text>
    </g>
    <g transform="translate(142, 0)">
      <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
      <text x="14" y="21" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📈 RevPAR Engine</text>
    </g>
    <g transform="translate(284, 0)">
      <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
      <text x="14" y="21" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🎯 Rate Shopping</text>
    </g>
    <g transform="translate(426, 0)">
      <rect width="125" height="34" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="14" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🤖 Open Source</text>
    </g>
  </g>

  <!-- Floating Metric Cards (Right Side Graphic) -->
  <g class="floating-card" transform="translate(860, 50)">
    <rect width="260" height="74" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.92"/>
    <text x="22" y="44" font-size="18">📊</text>
    <text x="54" y="30" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">REVPAR OPTIMIZATION</text>
    <text x="54" y="52" fill="#34d399" font-family="sans-serif" font-size="18" font-weight="800">+18.4% Lift</text>
  </g>

  <g class="floating-card" transform="translate(800, 140)">
    <rect width="270" height="74" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.92"/>
    <text x="22" y="44" font-size="18">⚡</text>
    <text x="54" y="30" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">ALGORITHMIC RATE UPDATES</text>
    <text x="54" y="52" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="800">Real-Time Autopilot</text>
  </g>

  <g class="floating-card" transform="translate(840, 230)">
    <rect width="280" height="74" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.92"/>
    <text x="22" y="44" font-size="18">🌐</text>
    <text x="54" y="30" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">COMPSET DEMAND TRACKING</text>
    <text x="54" y="52" fill="#facc15" font-family="sans-serif" font-size="18" font-weight="800">365-Day Forward Forecast</text>
  </g>
</svg>
